name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (but never cancel runs on main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  NODE_VERSION: 20
  # Electron binary is not needed for typecheck/test/build; skip the download in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (renderer + shared)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer and main process
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/renderer/index.html
          test -f dist/main/main/main.js
          test -f dist/main/main/preload.js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Only production dependencies ship to users; fail on high/critical advisories.
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

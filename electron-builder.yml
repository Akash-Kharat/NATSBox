appId: com.natsbox.app
productName: NATSBox
files:
  - dist/**/*
  - package.json
directories:
  output: release
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.png
linux:
  target: AppImage
  category: Development
  icon: assets/icon.png
